[project]
name = "atrium-sim"
version = "0.1.0"
description = "Physics-based bricklaying RL environment (Gymnasium + PyMunk): lay a running-bond wall to BIM ±3mm tolerance."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Bruno Chicelli" }]
keywords = ["reinforcement-learning", "gymnasium", "pymunk", "construction", "robotics"]
dependencies = [
    "gymnasium>=1.1,<2",
    "pymunk>=6.9,<7",
    "numpy>=1.26",
]

[project.optional-dependencies]
render = ["pygame-ce>=2.5", "imageio>=2.34"]
# torch alone: everything needed to load a checkpoint and run a forward pass. The whole
# inference path (train/agent.py, train/architectures.py, webviz/server.py's
# build_robot_policy, scripts/export_traces.py) imports numpy/torch only - tensorboard/tyro
# are function-local imports in train/ppo*.py, which this path never touches. Split out so
# .github/workflows/space.yml's requirements.txt generation and .github/workflows/
# pages.yml's trace bake can install exactly this instead of dragging in the
# training-loop deps.
infer = ["torch>=2.3"]
train = ["torch>=2.3", "tensorboard>=2.16", "tyro>=0.8"]
track = ["wandb>=0.17"]
plot = ["matplotlib>=3.8", "tbparse>=0.0.8"]
dev = ["pytest>=8", "ruff>=0.5"]
# webviz/api.py's runtime deps (the optional HF Space backend behind the static frontend) -
# a separate group from `train`/`infer` since the Space's dependency set should stay small:
# no tensorboard/wandb/matplotlib, none of which record_robot_trajectory's code path ever
# touches. The Space installs `serve` + `infer` together. `gradio` is here (not its own
# extra) because it's only ever needed alongside fastapi/uvicorn - deploy/space/app.py
# mounts webviz.api's FastAPI app inside a minimal gr.Blocks via gradio.mount_gradio_app,
# which is what makes the Space SDK-detected as "gradio" rather than "docker" - Docker-SDK
# Space creation now requires HF PRO (a policy change as of ~July 2026), while Gradio-SDK
# Spaces on ZeroGPU hardware remain free to create.
serve = ["fastapi>=0.115", "uvicorn[standard]>=0.30", "gradio>=5.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["atrium_sim"]

# MLP-scale training runs fine on CPU; the CPU wheel keeps installs small.
# Delete this block to get the default (CUDA) torch build.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
