<!--
  KNOWINGLY STALE: this is a third, independent visual skin (its own inline palette below),
  separate from the Next.js frontend (frontend/lib/replay/shared.ts's PALETTE) and the pygame
  renderer (atrium_sim/render/palette.py) - both of which were rebuilt onto a shared
  clay/warm-dark identity; this file wasn't, since it's a standalone zero-dependency page
  served by webviz/server.py for Tailscale/LAN access, not the deployed product. Left
  functional rather than deleted (it's still wired up, not dead code) - but its colors will
  now visibly diverge from every other renderer. Worth a full port or removal, not done here.
-->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Monumental.copy · replay</title>
<style>
  :root {
    --bg: #14161c; --panel: #1b1e26; --panel2: #22262f; --line: #2c313c;
    --ink: #e7e8ec; --muted: #9aa0ac; --accent: #edb100; --good: #5fb45a; --bad: #d64b45;
    --blue: #3987e5;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 14px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  header { padding: 14px 20px; border-bottom: 1px solid var(--line); display: flex;
    align-items: baseline; gap: 12px; flex-wrap: wrap; }
  header h1 { font-size: 16px; margin: 0; color: var(--accent); letter-spacing: .3px; }
  header .sub { color: var(--muted); font-size: 12.5px; }
  main { display: grid; grid-template-columns: minmax(0,1fr) 300px; gap: 16px; padding: 16px 20px; }
  @media (max-width: 820px) { main { grid-template-columns: 1fr; } }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; }
  .stage { padding: 10px; }
  canvas { width: 100%; height: auto; display: block; background: #0f1116; border-radius: 6px; }
  .controls { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; padding: 10px 12px;
    border-top: 1px solid var(--line); }
  button, select, input {
    background: var(--panel2); color: var(--ink); border: 1px solid var(--line);
    border-radius: 7px; padding: 7px 10px; font: inherit;
  }
  button { cursor: pointer; }
  button:hover:not(:disabled) { border-color: var(--muted); }
  button:disabled { opacity: .5; cursor: default; }
  button.primary { background: var(--accent); color: #1a1400; border-color: var(--accent); font-weight: 600; }
  button.play { min-width: 74px; }
  input[type=range] { flex: 1; min-width: 120px; accent-color: var(--accent); }
  label.small { color: var(--muted); font-size: 12px; }
  .row { display: flex; gap: 8px; align-items: center; }
  .side { display: flex; flex-direction: column; gap: 14px; }
  .field { display: flex; flex-direction: column; gap: 4px; }
  .field select, .field input { width: 100%; }
  .metrics { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 12px; padding: 12px; }
  .metric { display: flex; flex-direction: column; }
  .metric .v { font-size: 20px; font-variant-numeric: tabular-nums; }
  .metric .k { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .4px; }
  .metric .v.good { color: var(--good); } .metric .v.bad { color: var(--bad); }
  .strip { height: 46px; width: 100%; display: block; }
  .legend { display: flex; gap: 14px; flex-wrap: wrap; padding: 0 12px 12px; color: var(--muted); font-size: 12px; }
  .sw { display: inline-block; width: 11px; height: 11px; border-radius: 2px; vertical-align: -1px; margin-right: 4px; }
  .status { padding: 0 12px 12px; color: var(--muted); font-size: 12px; min-height: 18px; }
  h3 { margin: 12px 12px 0; font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; }
  .tag { font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<header>
  <h1>Monumental.copy</h1>
  <span class="sub">watch a policy lay a running-bond wall · reward = live BIM audit (±3&nbsp;mm)</span>
</header>
<main>
  <section class="card stage">
    <canvas id="stage" width="900" height="520"></canvas>
    <div class="controls">
      <button id="play" class="play">▶ Play</button>
      <input type="range" id="scrub" min="0" max="0" value="0" />
      <span class="tag muted" id="frameLabel" style="color:var(--muted); min-width:96px; text-align:right;">–</span>
      <label class="small">speed
        <select id="speed">
          <option value="0.5">0.5×</option>
          <option value="1" selected>1×</option>
          <option value="2">2×</option>
          <option value="4">4×</option>
        </select>
      </label>
      <label class="small"><input type="checkbox" id="labels" /> mm labels</label>
    </div>
    <h3>per-step reward</h3>
    <canvas id="strip" class="strip" width="900" height="46"></canvas>
    <div class="legend">
      <span><span class="sw" style="background:#5fb45a"></span>within ±3&nbsp;mm</span>
      <span><span class="sw" style="background:#e0a030"></span>close</span>
      <span><span class="sw" style="background:#d64b45"></span>out of tolerance</span>
      <span><span class="sw" style="background:#5a2d28"></span>stray / toppled</span>
      <span><span class="sw" style="border:1px dashed #6e737d;background:transparent"></span>blueprint target</span>
    </div>
  </section>

  <aside class="side">
    <section class="card">
      <h3>generate replay</h3>
      <div class="metrics" style="grid-template-columns:1fr;">
        <div class="field"><label class="small">policy</label><select id="policy"></select></div>
        <div class="row">
          <div class="field" style="flex:1"><label class="small">wall</label><select id="spec"></select></div>
          <div class="field" style="width:96px"><label class="small">seed</label><input type="number" id="seed" value="0" /></div>
        </div>
        <button class="primary" id="gen">Generate</button>
      </div>
      <div class="status" id="status"></div>
    </section>

    <section class="card">
      <h3>this run</h3>
      <div class="metrics">
        <div class="metric"><span class="v" id="m_intol">–</span><span class="k">in ±3mm</span></div>
        <div class="metric"><span class="v" id="m_filled">–</span><span class="k">filled</span></div>
        <div class="metric"><span class="v" id="m_return">–</span><span class="k">return</span></div>
        <div class="metric"><span class="v" id="m_waste">–</span><span class="k">waste</span></div>
        <div class="metric"><span class="v" id="m_dev">–</span><span class="k">mean dev</span></div>
        <div class="metric"><span class="v" id="m_step">–</span><span class="k">step</span></div>
      </div>
    </section>
  </aside>
</main>

<script>
const $ = (id) => document.getElementById(id);
const cv = $("stage"), ctx = cv.getContext("2d");
const strip = $("strip"), sctx = strip.getContext("2d");

// ---- geometry / matching (mirrors atrium_sim reward + renderer) ----
const GATE = 55, TOL = 3, TOL_DEG = 0.5, GATE_DEG = 15;
const foldDeg = (rad) => {
  let t = ((rad + Math.PI/2) % Math.PI + Math.PI) % Math.PI - Math.PI/2;
  return Math.abs(t) * 180/Math.PI;
};
function matchBricks(bricks, targets) {
  // greedy, kind-first, per-target nearest in gate; each brick consumed once
  const consumed = new Set(), matchOf = new Array(bricks.length).fill(null);
  for (let ti = 0; ti < targets.length; ti++) {
    const t = targets[ti];
    let best = null, bd = Infinity;
    for (let bi = 0; bi < bricks.length; bi++) {
      if (consumed.has(bi)) continue;
      const b = bricks[bi];
      if (b[3] !== t.kind) continue;
      if (foldDeg(b[2]) > GATE_DEG) continue;
      const d = Math.hypot(b[0]-t.x, b[1]-t.y);
      if (d > GATE) continue;
      if (d < bd) { bd = d; best = bi; }
    }
    if (best !== null) { consumed.add(best); matchOf[best] = {ti, d: bd}; }
  }
  return matchOf; // per-brick: {ti,d} or null (stray)
}
function qualityColor(d, deg) {
  if (d <= TOL && deg <= TOL_DEG) return "#5fb45a";
  const tt = Math.min(1, (d - TOL) / 15);
  return `rgb(${Math.round(200+30*tt)},${Math.round(150*(1-tt)+30)},40)`;
}

// ---- world -> canvas transform ----
let VIEW = null;
function setView(len, nCourses) {
  const xmin = -150, xmax = len + 150, ymin = -30, ymax = nCourses*60 + 170;
  const worldW = xmax - xmin, worldH = ymax - ymin;
  const W = cv.width, H = cv.height;
  const s = Math.min(W / worldW, H / worldH);
  const ox = (W - worldW*s)/2, oy = (H - worldH*s)/2;
  VIEW = { xmin, ymax, s, ox, oy };
}
const PX = (x) => VIEW.ox + (x - VIEW.xmin) * VIEW.s;
const PY = (y) => VIEW.oy + (VIEW.ymax - y) * VIEW.s;

function rrect(cx, cy, w, h, theta, fill, stroke, dash) {
  ctx.save();
  ctx.translate(PX(cx), PY(cy));
  ctx.rotate(-theta);
  const w2 = w*VIEW.s/2, h2 = h*VIEW.s/2, r = Math.min(5, w2, h2);
  ctx.beginPath();
  ctx.moveTo(-w2+r, -h2);
  ctx.arcTo(w2,-h2, w2,h2, r); ctx.arcTo(w2,h2, -w2,h2, r);
  ctx.arcTo(-w2,h2, -w2,-h2, r); ctx.arcTo(-w2,-h2, w2,-h2, r);
  ctx.closePath();
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
  if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = 1.5;
    if (dash) ctx.setLineDash([5,4]); ctx.stroke(); ctx.setLineDash([]); }
  ctx.restore();
}

// ---- replay state ----
let REPLAY = null, TL = [], playing = false, cur = 0, lastT = 0, showLabels = false;

function buildTimeline(replay) {
  // flatten step ticks into a global timeline; each frame remembers its step
  TL = [];
  replay.steps.forEach((st) => st.ticks.forEach((bricks) => TL.push({ st, bricks })));
  $("scrub").max = Math.max(0, TL.length - 1);
  drawStrip();
}

function draw() {
  const W = cv.width, H = cv.height;
  ctx.fillStyle = "#0f1116"; ctx.fillRect(0,0,W,H);
  if (!REPLAY || !TL.length) return;
  const frame = TL[Math.min(Math.floor(cur), TL.length-1)];
  const { st, bricks } = frame;
  const targets = REPLAY.targets;

  // ground
  ctx.fillStyle = "#3e434c";
  ctx.fillRect(0, PY(0), W, H - PY(0));

  const matchOf = matchBricks(bricks, targets);
  const filledT = new Set();
  matchOf.forEach((m) => { if (m) filledT.add(m.ti); });

  // ghost blueprint (unfilled targets only)
  for (let ti = 0; ti < targets.length; ti++) {
    if (filledT.has(ti)) continue;
    const t = targets[ti];
    rrect(t.x, t.y, t.w, t.h, 0, null, "#6e737d", true);
  }

  // bricks
  ctx.font = `${Math.max(9, 11*VIEW.s*2)}px ui-monospace, monospace`;
  ctx.textAlign = "center";
  for (let bi = 0; bi < bricks.length; bi++) {
    const b = bricks[bi], m = matchOf[bi];
    const w = b[3] === 1 ? 100 : 210, h = 50;
    // mortar band behind
    rrect(b[0], b[1], w+9, h+9, b[2], "#6a655f", null, false);
    let fill = "#5a2d28"; // stray / toppled
    if (m) fill = qualityColor(m.d, foldDeg(b[2]));
    else if (foldDeg(b[2]) < GATE_DEG) fill = "#b25c3e"; // upright but unmatched (in flight)
    rrect(b[0], b[1], w, h, b[2], fill, null, false);
    if (showLabels && m) {
      const t = targets[m.ti];
      ctx.fillStyle = "#cfd3da";
      ctx.fillText((b[0]-t.x>=0?"+":"") + (b[0]-t.x).toFixed(1), PX(b[0]), PY(b[1]+h/2+16));
    }
  }

  // HUD
  ctx.textAlign = "left";
  ctx.font = "13px ui-monospace, monospace";
  ctx.fillStyle = "#e7e8ec";
  const hud = `${REPLAY._policy}   ${REPLAY.spec.n_modules}m × ${REPLAY.spec.n_courses}c   `
    + `step ${st.i+1}/${REPLAY.steps.length}   in-tol ${(st.frac_in_tol*100).toFixed(0)}%   `
    + `filled ${(st.frac_filled*100).toFixed(0)}%   waste ${st.waste}   return ${st.return.toFixed(2)}`;
  ctx.fillText(hud, 12, 20);
}

function drawStrip() {
  const W = strip.width, H = strip.height;
  sctx.clearRect(0,0,W,H);
  if (!REPLAY) return;
  const steps = REPLAY.steps, n = steps.length;
  const bw = W / n, mid = H*0.55;
  const maxAbs = Math.max(0.5, ...steps.map(s => Math.abs(s.reward)));
  sctx.strokeStyle = "#2c313c"; sctx.beginPath(); sctx.moveTo(0,mid); sctx.lineTo(W,mid); sctx.stroke();
  const curStep = TL.length ? TL[Math.min(Math.floor(cur),TL.length-1)].st.i : -1;
  for (let i = 0; i < n; i++) {
    const r = steps[i].reward, hgt = (Math.abs(r)/maxAbs) * (H*0.42);
    sctx.fillStyle = i === curStep ? "#edb100" : (r >= 0 ? "#5fb45a" : "#d64b45");
    if (r >= 0) sctx.fillRect(i*bw+0.5, mid-hgt, Math.max(1,bw-1), hgt);
    else sctx.fillRect(i*bw+0.5, mid, Math.max(1,bw-1), hgt);
  }
}
strip.addEventListener("click", (e) => {
  if (!REPLAY) return;
  const rect = strip.getBoundingClientRect();
  const frac = (e.clientX - rect.left) / rect.width;
  const stepIdx = Math.floor(frac * REPLAY.steps.length);
  const gi = TL.findIndex(f => f.st.i === stepIdx);
  if (gi >= 0) { cur = gi; $("scrub").value = cur; draw(); drawStrip(); updateFrameLabel(); }
});

function updateFrameLabel() {
  $("frameLabel").textContent = TL.length ? `${Math.floor(cur)+1}/${TL.length}` : "–";
}

// ---- playback loop ----
function tick(ts) {
  if (playing && TL.length) {
    const dt = (ts - lastT) / 1000; lastT = ts;
    const fps = 30 * parseFloat($("speed").value);
    cur += fps * dt;
    if (cur >= TL.length - 1) { cur = TL.length - 1; playing = false; $("play").textContent = "▶ Play"; }
    const ci = Math.floor(cur);
    $("scrub").value = ci; draw(); drawStrip(); updateFrameLabel();
  } else { lastT = ts; }
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);

$("play").onclick = () => {
  if (!TL.length) return;
  if (cur >= TL.length - 1) cur = 0;
  playing = !playing;
  $("play").textContent = playing ? "❚❚ Pause" : "▶ Play";
};
$("scrub").oninput = (e) => { cur = +e.target.value; playing = false; $("play").textContent = "▶ Play";
  draw(); drawStrip(); updateFrameLabel(); };
$("labels").onchange = (e) => { showLabels = e.target.checked; draw(); };

// ---- metrics panel ----
function setMetrics(m) {
  const intol = m.frac_in_tol*100, filled = m.frac_filled*100;
  $("m_intol").textContent = intol.toFixed(0) + "%";
  $("m_intol").className = "v " + (intol >= 90 ? "good" : intol < 30 ? "bad" : "");
  $("m_filled").textContent = filled.toFixed(0) + "%";
  $("m_return").textContent = (m.episode_return>=0?"+":"") + m.episode_return.toFixed(2);
  $("m_return").className = "v " + (m.episode_return >= 0 ? "good" : "bad");
  $("m_waste").textContent = m.waste_count.toFixed(0);
  $("m_dev").textContent = m.mean_abs_dev_mm.toFixed(1) + " mm";
  $("m_step").textContent = m.placements.toFixed(0);
}

// ---- API ----
async function loadPolicies() {
  const r = await fetch("/api/policies"); const d = await r.json();
  $("policy").innerHTML = d.policies.map(p => `<option value="${p}">${p}</option>`).join("");
  $("spec").innerHTML = d.specs.map(s => `<option value="${s}"${s==="4x4"?" selected":""}>${s}</option>`).join("");
}
async function generate() {
  const btn = $("gen"); btn.disabled = true;
  $("status").textContent = "running episode…";
  playing = false; $("play").textContent = "▶ Play";
  try {
    const body = { policy: $("policy").value, seed: +$("seed").value, spec: $("spec").value };
    const r = await fetch("/api/episode", { method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify(body) });
    const d = await r.json();
    if (d.error) { $("status").textContent = "error: " + d.error; return; }
    d._policy = body.policy;
    REPLAY = d; cur = 0;
    setView(d.length, d.n_courses);
    buildTimeline(d);
    setMetrics(d.metrics);
    draw(); updateFrameLabel();
    $("status").textContent = `${d.steps.length} placements · ${TL.length} frames · seed ${d.seed}`;
  } catch (e) {
    $("status").textContent = "request failed: " + e;
  } finally { btn.disabled = false; }
}
$("gen").onclick = generate;

loadPolicies().then(generate);
</script>
</body>
</html>
